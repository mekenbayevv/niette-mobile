<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NIETTE · Торгпред</title>
<style>
/* ── RESET ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: -apple-system, 'Inter', sans-serif; background: #F1F5F9; color: #0F172A; -webkit-tap-highlight-color: transparent; }

/* ── VARIABLES ── */
:root {
  --blue:   #2563EB;
  --green:  #16A34A;
  --red:    #DC2626;
  --yellow: #D97706;
  --dark:   #0F172A;
  --mid:    #475569;
  --light:  #94A3B8;
  --border: #E2E8F0;
  --bg:     #F1F5F9;
  --white:  #FFFFFF;
  --radius: 12px;
}

/* ── HEADER ── */
.app-header {
  background: var(--dark); color: var(--white);
  padding: 14px 16px 10px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
.app-logo { font-size: 17px; font-weight: 800; letter-spacing: -0.5px; }
.app-logo span { color: #60A5FA; }
.rep-name { font-size: 12px; color: #64748B; }
.btn-logout { background: none; border: none; color: #64748B; font-size: 20px; cursor: pointer; padding: 4px; }

/* ── BOTTOM NAV ── */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--white); border-top: 1px solid var(--border);
  display: flex; z-index: 100;
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-btn {
  flex: 1; background: none; border: none; cursor: pointer;
  padding: 10px 4px 8px; display: flex; flex-direction: column;
  align-items: center; gap: 3px; font-family: inherit;
  color: var(--light); transition: color .15s;
}
.nav-btn.active { color: var(--blue); }
.nav-btn .nav-icon { font-size: 22px; line-height: 1; }
.nav-btn .nav-label { font-size: 10px; font-weight: 600; }

/* ── SCREENS ── */
.screen { display: none; padding: 16px 16px 90px; }
.screen.active { display: block; }

/* ── CARDS ── */
.card {
  background: var(--white); border-radius: var(--radius);
  border: 1px solid var(--border); margin-bottom: 12px; overflow: hidden;
}
.card-header { padding: 14px 16px 0; }
.card-title { font-size: 14px; font-weight: 700; color: var(--dark); }
.card-sub   { font-size: 11px; color: var(--light); margin-top: 2px; }
.card-body  { padding: 14px 16px; }

/* ── FORM ── */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 11px; font-weight: 700; color: var(--light); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
.field input, .field select, .field textarea {
  width: 100%; border: 1.5px solid var(--border); border-radius: 8px;
  padding: 11px 12px; font-size: 15px; font-family: inherit;
  color: var(--dark); background: var(--white); outline: none;
  transition: border-color .15s; appearance: none;
}
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,.12);
}
.field textarea { resize: vertical; min-height: 80px; }

/* Checkbox group */
.checkbox-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.check-item { display: flex; align-items: center; gap: 8px; background: var(--bg); border-radius: 8px; padding: 10px 12px; cursor: pointer; border: 1.5px solid transparent; transition: all .15s; }
.check-item input { width: 18px; height: 18px; accent-color: var(--blue); flex-shrink: 0; }
.check-item span { font-size: 13px; color: var(--dark); line-height: 1.2; }
.check-item:has(input:checked) { border-color: var(--blue); background: #EFF6FF; }

/* ── BUTTONS ── */
.btn {
  width: 100%; padding: 15px; border-radius: var(--radius); border: none;
  font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer;
  transition: all .15s; display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-primary { background: var(--blue); color: var(--white); }
.btn-primary:active { background: #1D4ED8; transform: scale(.98); }
.btn-success { background: var(--green); color: var(--white); }
.btn-success:active { background: #15803D; transform: scale(.98); }
.btn-secondary { background: var(--bg); color: var(--dark); border: 1.5px solid var(--border); }

/* ── KPI STRIP ── */
.kpi-strip { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
.kpi-card { background: var(--white); border-radius: var(--radius); padding: 14px; border: 1px solid var(--border); }
.kpi-label { font-size: 10px; font-weight: 700; color: var(--light); text-transform: uppercase; letter-spacing: .5px; }
.kpi-value { font-size: 22px; font-weight: 800; color: var(--dark); margin-top: 4px; }
.kpi-value.green  { color: var(--green); }
.kpi-value.red    { color: var(--red); }
.kpi-value.yellow { color: var(--yellow); }

/* ── CLIENT LIST ── */
.client-item { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; cursor: pointer; transition: background .1s; }
.client-item:last-child { border-bottom: none; }
.client-item:active { background: var(--bg); }
.client-avatar { width: 40px; height: 40px; border-radius: 10px; background: #EFF6FF; color: var(--blue); font-size: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.client-info { flex: 1; min-width: 0; }
.client-name { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.client-meta { font-size: 12px; color: var(--light); margin-top: 1px; }
.client-debt { text-align: right; }
.client-debt-amount { font-size: 13px; font-weight: 700; color: var(--red); }
.client-debt-label  { font-size: 10px; color: var(--light); }

/* ── BADGE ── */
.badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 700; }
.badge-green  { background: #DCFCE7; color: #15803D; }
.badge-yellow { background: #FEF3C7; color: #92400E; }
.badge-red    { background: #FEE2E2; color: #991B1B; }
.badge-blue   { background: #DBEAFE; color: #1D4ED8; }

/* ── SUCCESS SCREEN ── */
.success-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200; align-items: center; justify-content: center; padding: 24px; }
.success-overlay.show { display: flex; }
.success-box { background: var(--white); border-radius: 20px; padding: 32px 24px; text-align: center; max-width: 320px; width: 100%; }
.success-icon { font-size: 56px; margin-bottom: 12px; }
.success-title { font-size: 20px; font-weight: 800; color: var(--dark); }
.success-sub { font-size: 14px; color: var(--light); margin-top: 8px; margin-bottom: 24px; }

/* ── LOGIN ── */
.login-wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; background: var(--dark); }
.login-logo { font-size: 32px; font-weight: 900; color: var(--white); letter-spacing: -1px; margin-bottom: 4px; }
.login-logo span { color: #60A5FA; }
.login-sub { font-size: 14px; color: #64748B; margin-bottom: 40px; }
.login-card { background: var(--white); border-radius: 20px; padding: 28px 24px; width: 100%; max-width: 360px; }
.login-title { font-size: 18px; font-weight: 800; color: var(--dark); margin-bottom: 20px; }

/* ── TOAST ── */
.toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--dark); color: var(--white); padding: 12px 20px; border-radius: 30px; font-size: 13px; font-weight: 600; opacity: 0; transition: all .3s; z-index: 300; white-space: nowrap; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── DIVIDER ── */
.divider { height: 1px; background: var(--border); margin: 16px 0; }
.section-title { font-size: 12px; font-weight: 700; color: var(--light); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 10px; }

/* ── SPINNER ── */
.spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid rgba(255,255,255,.3); border-top-color: white; border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- ══ LOGIN ══════════════════════════════════════════════════════ -->
<div id="loginScreen" class="login-wrap">
  <div class="login-logo">NIE<span>TTE</span></div>
  <div class="login-sub">B2B · Торговый представитель</div>
  <div class="login-card">
    <div class="login-title">Вход</div>
    <div class="field">
      <label>Имя</label>
      <input id="loginName" type="text" placeholder="Твоё имя" autocomplete="name">
    </div>
    <div class="field">
      <label>Пароль</label>
      <input id="loginPass" type="password" placeholder="••••••">
    </div>
    <button class="btn btn-primary" onclick="login()">Войти</button>
  </div>
</div>

<!-- ══ APP ════════════════════════════════════════════════════════ -->
<div id="appWrap" style="display:none">

  <header class="app-header">
    <div>
      <div class="app-logo">NIE<span>TTE</span></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="rep-name" id="repNameBadge"></span>
      <button class="btn-logout" onclick="logout()" title="Выйти">⬅</button>
    </div>
  </header>

  <!-- ── ЭКРАН: Сегодня ───────────────────────────────────────── -->
  <div class="screen active" id="screen-today">
    <div class="kpi-strip">
      <div class="kpi-card">
        <div class="kpi-label">Визитов сегодня</div>
        <div class="kpi-value green" id="kpiVisitsToday">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Визитов за месяц</div>
        <div class="kpi-value" id="kpiVisitsMonth">0</div>
      </div>
    </div>

    <div class="section-title">Быстрые действия</div>
    <div class="card" style="margin-bottom:12px">
      <div class="card-body" style="display:flex;flex-direction:column;gap:10px">
        <button class="btn btn-primary" onclick="showTab('visit')">📝 &nbsp;Записать визит</button>
        <button class="btn btn-success" onclick="showTab('shipment')">📦 &nbsp;Оформить отгрузку</button>
      </div>
    </div>

    <div class="section-title">Мои визиты сегодня</div>
    <div class="card" id="todayVisitsList">
      <div style="padding:20px;text-align:center;color:var(--light);font-size:13px">
        Визитов пока нет
      </div>
    </div>
  </div>

  <!-- ── ЭКРАН: Визит ─────────────────────────────────────────── -->
  <div class="screen" id="screen-visit">
    <div class="card">
      <div class="card-header">
        <div class="card-title">📝 Новый визит</div>
        <div class="card-sub">Заполни после каждого визита</div>
      </div>
      <div class="card-body">
        <div class="field">
          <label>Клиент *</label>
          <select id="vClient" onchange="onClientChange('v')">
            <option value="">— выбери клиента —</option>
          </select>
        </div>
        <div class="field" id="vNewClientWrap" style="display:none">
          <label>Название новой аптеки</label>
          <input id="vNewClientName" type="text" placeholder="Например: Аптека Алоэ">
        </div>
        <div class="field">
          <label>Адрес</label>
          <input id="vAddress" type="text" placeholder="Улица, дом">
        </div>
        <div class="field">
          <label>Контактное лицо</label>
          <input id="vContact" type="text" placeholder="ФИО">
        </div>
        <div class="field">
          <label>Телефон</label>
          <input id="vPhone" type="tel" placeholder="+7 (xxx) xxx xx xx" oninput="formatPhone(this)" maxlength="18">
        </div>
        <div class="field">
          <label>Результат визита *</label>
          <select id="vResult">
            <option value="">— выбери —</option>
            <option>✅ Договорились — берут сразу</option>
            <option>📋 Под консигнацию</option>
            <option>🔄 Под реализацию</option>
            <option>🕐 Думают — перезвонить</option>
            <option>⚡ Дозаказ — уже клиент</option>
            <option>❌ Отказали</option>
          </select>
        </div>
        <div class="field">
          <label>Потенциал в месяц</label>
          <select id="vPotential">
            <option value="">— не определён —</option>
            <option value="50000">до 50 000 ₸</option>
            <option value="150000">50 000 – 150 000 ₸</option>
            <option value="500000">150 000 – 500 000 ₸</option>
            <option value="1000000">500 000 – 1 000 000 ₸</option>
            <option value="2000000">более 1 000 000 ₸</option>
          </select>
        </div>
        <div class="field">
          <label>Дата следующего контакта</label>
          <input id="vNextDate" type="date">
        </div>
        <div class="field">
          <label>Комментарий</label>
          <textarea id="vComment" placeholder="Возражения, детали, пожелания..."></textarea>
        </div>
        <button class="btn btn-primary" id="btnSubmitVisit" onclick="submitVisit()">
          Отправить визит
        </button>
      </div>
    </div>
  </div>

  <!-- ── ЭКРАН: Отгрузка ──────────────────────────────────────── -->
  <div class="screen" id="screen-shipment">
    <div class="card">
      <div class="card-header">
        <div class="card-title">📦 Новая отгрузка</div>
        <div class="card-sub">Фиксируй позиции и количество</div>
      </div>
      <div class="card-body">
        <div class="field">
          <label>Клиент *</label>
          <select id="sClient" onchange="onClientChange('s')">
            <option value="">— выбери клиента —</option>
          </select>
        </div>

        <!-- Позиции -->
        <div class="field">
          <label>Позиции *</label>
          <div id="sItemsWrap" style="display:flex;flex-direction:column;gap:6px"></div>
        </div>

        <!-- Итого -->
        <div style="background:#f0fdf4;border-radius:10px;padding:14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:13px;font-weight:700;color:#15803d">Итого</span>
          <span style="font-size:20px;font-weight:800;color:#15803d" id="sTotalDisplay">0 ₸</span>
        </div>

        <div class="field">
          <label>Дата отгрузки *</label>
          <input id="sShipDate" type="date">
        </div>
        <div class="field">
          <label>Ожидаемая дата оплаты</label>
          <input id="sDueDate" type="date">
        </div>
        <div class="field">
          <label>№ накладной</label>
          <input id="sInvoice" type="text" placeholder="НК-006">
        </div>
        <div class="field">
          <label>Комментарий</label>
          <textarea id="sComment" placeholder="Особые условия..."></textarea>
        </div>
        <button class="btn btn-success" id="btnSubmitShipment" onclick="submitShipment()">
          Оформить отгрузку
        </button>
      </div>
    </div>
  </div>

  <!-- ── ЭКРАН: Клиенты ───────────────────────────────────────── -->
  <div class="screen" id="screen-clients">
    <div class="field" style="margin-bottom:12px">
      <input id="searchClients" type="search" placeholder="🔍 Поиск аптеки..." oninput="renderClientList()">
    </div>
    <div class="card" id="clientListWrap">
      <div style="padding:20px;text-align:center;color:var(--light)">Загрузка...</div>
    </div>
  </div>

  <!-- ── BOTTOM NAV ──────────────────────────────────────────── -->
  <nav class="bottom-nav">
    <button class="nav-btn active" id="nav-today" onclick="showTab('today')">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">Сегодня</span>
    </button>
    <button class="nav-btn" id="nav-visit" onclick="showTab('visit')">
      <span class="nav-icon">📝</span>
      <span class="nav-label">Визит</span>
    </button>
    <button class="nav-btn" id="nav-shipment" onclick="showTab('shipment')">
      <span class="nav-icon">📦</span>
      <span class="nav-label">Отгрузка</span>
    </button>
    <button class="nav-btn" id="nav-clients" onclick="showTab('clients')">
      <span class="nav-icon">🏪</span>
      <span class="nav-label">Аптеки</span>
    </button>
  </nav>

</div><!-- /appWrap -->

<!-- ── SUCCESS OVERLAY ── -->
<div class="success-overlay" id="successOverlay">
  <div class="success-box">
    <div class="success-icon" id="successIcon">✅</div>
    <div class="success-title" id="successTitle">Отправлено!</div>
    <div class="success-sub" id="successSub">Данные сохранены</div>
    <button class="btn btn-primary" onclick="closeSuccess()">Готово</button>
  </div>
</div>

<!-- ── TOAST ── -->
<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════════════════════
// CONFIG — вставь свой URL после деплоя Apps Script
// ══════════════════════════════════════════════════════════════
const API_URL = 'https://script.google.com/macros/s/AKfycbzDkI7OyePfKnqeUpxHuehRU2smplZxPotpag6oUvgX-ztvGPcapAzjnPljt4_pg2-t/exec';

const PRODUCTS = [
  'Подгузники S', 'Подгузники M',
  'Трусики L',    'Трусики XL',  'Трусики XXL',
  'Салфетки влажные',
  'Минипак S',    'Минипак M',   'Минипак L',  'Минипак XL', 'Минипак XXL',
];

// Цены по умолчанию и варианты для каждого товара
const PRODUCT_PRICES = {
  'Подгузники S':    { default: 7700, options: [7700, 7500, 7300, 7100] },
  'Подгузники M':    { default: 7700, options: [7700, 7500, 7300, 7100] },
  'Трусики L':       { default: 7700, options: [7700, 7500, 7300, 7100] },
  'Трусики XL':      { default: 7700, options: [7700, 7500, 7300, 7100] },
  'Трусики XXL':     { default: 7700, options: [7700, 7500, 7300, 7100] },
  'Салфетки влажные':{ default: 690,  options: [690] },
  'Минипак S':       { default: 450,  options: [450] },
  'Минипак M':       { default: 450,  options: [450] },
  'Минипак L':       { default: 450,  options: [450] },
  'Минипак XL':      { default: 450,  options: [450] },
  'Минипак XXL':     { default: 450,  options: [450] },
};

const PASSWORDS = {
  'Торгпред': '1234',   // имя: пароль — добавляй своих
  'Самат':    'niette',
};

// ── STATE ──────────────────────────────────────────────────────
let repName   = '';
let clients   = [];
let myVisits  = [];

// ══════════════════════════════════════════════════════════════
// AUTH
// ══════════════════════════════════════════════════════════════
function login() {
  const name = document.getElementById('loginName').value.trim();
  const pass = document.getElementById('loginPass').value;
  if (!name) return toast('Введи имя');
  if (PASSWORDS[name] && PASSWORDS[name] !== pass) return toast('Неверный пароль');
  repName = name;
  localStorage.setItem('rep', name);
  showApp();
}

function logout() {
  localStorage.removeItem('rep');
  document.getElementById('appWrap').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
}

function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appWrap').style.display = 'block';
  document.getElementById('repNameBadge').textContent = repName;
  initShipmentItems();
  loadClients();
  setDefaultDates();
}

// ══════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════

function setDefaultDates() {
  const today = new Date().toISOString().slice(0, 10);
  const plus7 = new Date(Date.now() + 7*86400000).toISOString().slice(0, 10);
  document.getElementById('sShipDate').value = today;
  document.getElementById('sDueDate').value  = plus7;
  document.getElementById('vNextDate').value = plus7;
}

async function loadClients() {
  try {
    const res  = await api('POST', { action: 'clients' });
    clients    = res || [];
    populateClientDropdowns();
    renderClientList();
    updateTodayStats();
  } catch(e) {
    // Работаем офлайн — показываем пустой список
    clients = [];
    populateClientDropdowns();
  }
}

function populateClientDropdowns() {
  const opts = clients.map(c =>
    `<option value="${c['ID']}" data-type="${c['Тип']}" data-contact="${c['Контакт']}" data-phone="${c['Телефон']}">${c['Название']} · ${c['Город']}</option>`
  ).join('');
  const newOpt = '<option value="__new__">+ Новая аптека</option>';

  document.getElementById('vClient').innerHTML =
    '<option value="">— выбери клиента —</option>' + opts + newOpt;
  document.getElementById('sClient').innerHTML =
    '<option value="">— выбери клиента —</option>' + opts;
}

function onClientChange(prefix) {
  const sel = document.getElementById(prefix + 'Client');
  const val = sel.value;
  if (prefix === 'v') {
    document.getElementById('vNewClientWrap').style.display = val === '__new__' ? 'block' : 'none';
    if (val && val !== '__new__') {
      const opt = sel.options[sel.selectedIndex];
      document.getElementById('vContact').value = opt.dataset.contact || '';
      document.getElementById('vPhone').value   = opt.dataset.phone   || '';
    }
  }
}

function renderClientList() {
  const q    = (document.getElementById('searchClients').value || '').toLowerCase();
  const list = clients.filter(c =>
    !q || c['Название'].toLowerCase().includes(q) || (c['Город'] || '').toLowerCase().includes(q)
  );
  const wrap = document.getElementById('clientListWrap');
  if (!list.length) {
    wrap.innerHTML = '<div style="padding:24px;text-align:center;color:var(--light)">Нет клиентов</div>';
    return;
  }
  wrap.innerHTML = list.map(c => {
    const icon = c['Тип'] === 'Аптека' ? '💊' : c['Тип'] === 'Оптовик' ? '🏭' : '🏪';
    return `
      <div class="client-item">
        <div class="client-avatar">${icon}</div>
        <div class="client-info">
          <div class="client-name">${c['Название']}</div>
          <div class="client-meta">${c['Город']} · ${c['Тип']}</div>
        </div>
      </div>`;
  }).join('');
}

function updateTodayStats() {
  const todayStr = new Date().toISOString().slice(0, 10);
  const todayV   = myVisits.filter(v => v.date === todayStr);
  document.getElementById('kpiVisitsToday').textContent  = todayV.length;
  document.getElementById('kpiVisitsMonth').textContent  = myVisits.length;

  const listEl = document.getElementById('todayVisitsList');
  if (!todayV.length) {
    listEl.innerHTML = '<div style="padding:20px;text-align:center;color:var(--light);font-size:13px">Визитов пока нет</div>';
    return;
  }
  listEl.innerHTML = todayV.map(v => `
    <div class="client-item">
      <div class="client-avatar">📝</div>
      <div class="client-info">
        <div class="client-name">${v.clientName}</div>
        <div class="client-meta">${v.result}</div>
      </div>
    </div>`).join('');
}

// ══════════════════════════════════════════════════════════════
// SUBMIT
// ══════════════════════════════════════════════════════════════
async function submitVisit() {
  const sel        = document.getElementById('vClient');
  const clientId   = sel.value;
  const clientName = clientId === '__new__'
    ? document.getElementById('vNewClientName').value.trim()
    : sel.options[sel.selectedIndex]?.text?.split(' · ')[0] || '';
  const result = document.getElementById('vResult').value;

  if (!clientId) return toast('Выбери клиента');
  if (!clientName) return toast('Введи название аптеки');
  if (!result)     return toast('Укажи результат визита');

  const contact = document.getElementById('vContact').value;
  const phone   = document.getElementById('vPhone').value;

  if (phone && !validatePhone(phone)) return toast('Телефон должен быть в формате +7 (xxx) xxx xx xx');

  setBtnLoading('btnSubmitVisit', true);
  try {
    // Новая аптека — сначала создаём клиента в CRM
    let resolvedClientId = clientId;
    if (clientId === '__new__') {
      const res = await api('POST', { action: 'addClient', data: {
        name:    clientName,
        type:    'Аптека',
        stage:   'Новый',
        city:    '',
        contact, phone,
        rep:     repName,
      }});
      resolvedClientId = res.id;
      // Добавляем в локальный список чтобы сразу появилась в Отгрузках
      clients.push({ 'ID': resolvedClientId, 'Название': clientName, 'Тип': 'Аптека', 'Город': '', 'Контакт': contact, 'Телефон': phone });
      populateClientDropdowns();
    }

    const data = {
      date:      new Date().toISOString().slice(0, 10),
      clientId:  resolvedClientId,
      clientName, result, contact, phone,
      address:   document.getElementById('vAddress').value,
      potential: document.getElementById('vPotential').value,
      nextDate:  document.getElementById('vNextDate').value,
      comment:   document.getElementById('vComment').value,
      rep:       repName,
      city:      clients.find(c => c['ID'] === resolvedClientId)?.['Город'] || '',
    };

    await api('POST', { action: 'addVisit', data });
    myVisits.unshift(data);
    updateTodayStats();
    resetVisitForm();
    showSuccess('📝', 'Визит записан!', clientName);
    showTab('today');
  } catch(e) {
    toast('Ошибка: ' + e.message);
  } finally {
    setBtnLoading('btnSubmitVisit', false);
  }
}

async function submitShipment() {
  const sel        = document.getElementById('sClient');
  const clientId   = sel.value;
  const clientName = sel.options[sel.selectedIndex]?.text?.split(' · ')[0] || '';
  const shipDate   = document.getElementById('sShipDate').value;
  const items      = getShipmentItems();
  const amount     = items.reduce((s, i) => s + i.sum, 0);

  if (!clientId)       return toast('Выбери клиента');
  if (!shipDate)       return toast('Укажи дату отгрузки');
  if (!items.length)   return toast('Добавь хотя бы одну позицию');
  if (amount === 0)    return toast('Укажи количество и цену');

  const client = clients.find(c => c['ID'] === clientId) || {};
  const data = {
    clientId, clientName,
    clientType: client['Тип'] || '',
    shipDate,
    dueDate:    document.getElementById('sDueDate').value,
    amount,
    items,
    invoiceNum: document.getElementById('sInvoice').value,
    comment:    document.getElementById('sComment').value,
    status:     'Отгружено',
  };

  setBtnLoading('btnSubmitShipment', true);
  try {
    await api('POST', { action: 'addShipment', data });
    resetShipmentForm();
    showSuccess('📦', 'Отгрузка оформлена!', clientName + '\n' + Number(amount).toLocaleString('ru') + ' ₸');
    showTab('today');
  } catch(e) {
    toast('Ошибка: ' + e.message);
  } finally {
    setBtnLoading('btnSubmitShipment', false);
  }
}

// ══════════════════════════════════════════════════════════════
// API
// ══════════════════════════════════════════════════════════════
async function api(method, payload, _retry = true) {
  if (API_URL === 'ВСТАВЬ_EXEC_URL_APPS_SCRIPT') {
    console.warn('API URL не настроен — работаем локально');
    return [];
  }
  try {
    const res = await fetch(API_URL, {
      method:   'POST',
      redirect: 'follow',
      body:     JSON.stringify(payload),
      headers:  { 'Content-Type': 'text/plain;charset=utf-8' }
    });
    const text = await res.text();
    let json;
    try { json = JSON.parse(text); } catch(e) { throw new Error('Ответ сервера: ' + text.slice(0, 100)); }
    if (json && json.error) throw new Error(json.error);
    return json;
  } catch(e) {
    if (_retry) {
      await new Promise(r => setTimeout(r, 1500));
      return api(method, payload, false);
    }
    throw e;
  }
}

// ══════════════════════════════════════════════════════════════
// UI HELPERS
// ══════════════════════════════════════════════════════════════
function showTab(tab) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('screen-' + tab)?.classList.add('active');
  document.getElementById('nav-' + tab)?.classList.add('active');
  window.scrollTo(0, 0);
}

function showSuccess(icon, title, sub) {
  document.getElementById('successIcon').textContent  = icon;
  document.getElementById('successTitle').textContent = title;
  document.getElementById('successSub').textContent   = sub;
  document.getElementById('successOverlay').classList.add('show');
}

function closeSuccess() {
  document.getElementById('successOverlay').classList.remove('show');
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

function setBtnLoading(id, loading) {
  const btn = document.getElementById(id);
  if (loading) {
    btn._text = btn.innerHTML;
    btn.innerHTML = '<span class="spinner"></span>';
    btn.disabled = true;
  } else {
    btn.innerHTML = btn._text;
    btn.disabled  = false;
  }
}

function resetVisitForm() {
  ['vClient','vResult','vPotential','vNextDate','vContact','vPhone','vAddress','vComment'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  document.getElementById('vNewClientName').value = '';
  document.getElementById('vNewClientWrap').style.display = 'none';
  setDefaultDates();
}

function resetShipmentForm() {
  ['sClient','sInvoice','sComment'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  initShipmentItems();
  document.getElementById('sTotalDisplay').textContent = '0 ₸';
  setDefaultDates();
}

// ══════════════════════════════════════════════════════════════
// SHIPMENT ITEMS
// ══════════════════════════════════════════════════════════════
function initShipmentItems() {
  const wrap = document.getElementById('sItemsWrap');
  wrap.innerHTML = PRODUCTS.map((p, i) => {
    const cfg  = PRODUCT_PRICES[p] || { default: 7700, options: [7700, 7500, 7300, 7100] };
    const opts = cfg.options.map(pr =>
      `<option value="${pr}"${pr === cfg.default ? ' selected' : ''}>${pr.toLocaleString('ru')} ₸</option>`
    ).join('') + '<option value="custom">Другая цена</option>';

    return `
    <div id="sRow_${i}" style="background:var(--white);border-radius:10px;border:1.5px solid var(--border);padding:12px;transition:border-color .15s">
      <div style="display:flex;align-items:center;gap:10px">
        <input type="checkbox" id="sChk_${i}" onchange="toggleShipRow(${i})"
          style="width:20px;height:20px;accent-color:var(--blue);flex-shrink:0;cursor:pointer">
        <label for="sChk_${i}" style="font-size:14px;font-weight:600;color:var(--dark);cursor:pointer;flex:1">${p}</label>
        <span id="sRowSum_${i}" style="font-size:13px;font-weight:700;color:var(--light)">—</span>
      </div>
      <div id="sRowDetail_${i}" style="display:none;margin-top:10px">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <div>
            <div style="font-size:10px;font-weight:700;color:var(--light);margin-bottom:4px">КОЛ-ВО</div>
            <input type="number" id="sQty_${i}" inputmode="numeric" placeholder="0" min="1"
              oninput="calcShipmentTotal()"
              style="width:100%;border:1.5px solid var(--border);border-radius:8px;padding:10px;font-size:16px;font-family:inherit;color:var(--dark);background:var(--bg)">
          </div>
          <div>
            <div style="font-size:10px;font-weight:700;color:var(--light);margin-bottom:4px">ЦЕНА ЗА ШТ, ₸</div>
            <select id="sPrice_${i}" onchange="onPriceChange(${i})"
              style="width:100%;border:1.5px solid var(--border);border-radius:8px;padding:10px;font-size:14px;font-family:inherit;color:var(--dark);background:var(--bg);appearance:none">
              ${opts}
            </select>
            <input type="number" id="sCustomPrice_${i}" inputmode="numeric" placeholder="Введи цену"
              oninput="calcShipmentTotal()"
              style="display:none;width:100%;border:1.5px solid var(--blue);border-radius:8px;padding:10px;font-size:15px;font-family:inherit;color:var(--dark);background:var(--bg);margin-top:6px">
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleShipRow(i) {
  const checked = document.getElementById('sChk_' + i).checked;
  const detail  = document.getElementById('sRowDetail_' + i);
  const row     = document.getElementById('sRow_' + i);
  detail.style.display = checked ? 'block' : 'none';
  row.style.borderColor = checked ? 'var(--blue)' : 'var(--border)';
  if (checked) document.getElementById('sQty_' + i).focus();
  else {
    document.getElementById('sQty_' + i).value = '';
    document.getElementById('sRowSum_' + i).textContent = '—';
    document.getElementById('sRowSum_' + i).style.color = 'var(--light)';
  }
  calcShipmentTotal();
}

function onPriceChange(i) {
  const sel    = document.getElementById('sPrice_' + i);
  const custom = document.getElementById('sCustomPrice_' + i);
  custom.style.display = sel.value === 'custom' ? 'block' : 'none';
  calcShipmentTotal();
}

function getItemPrice(i) {
  const sel = document.getElementById('sPrice_' + i);
  if (sel.value === 'custom') return parseFloat(document.getElementById('sCustomPrice_' + i).value) || 0;
  return parseFloat(sel.value) || 0;
}

function calcShipmentTotal() {
  let total = 0;
  PRODUCTS.forEach((p, i) => {
    const checked = document.getElementById('sChk_' + i)?.checked;
    if (!checked) return;
    const qty   = parseFloat(document.getElementById('sQty_' + i)?.value) || 0;
    const price = getItemPrice(i);
    const sum   = qty * price;
    const sumEl = document.getElementById('sRowSum_' + i);
    if (sumEl) {
      sumEl.textContent = sum > 0 ? sum.toLocaleString('ru') + ' ₸' : '0 ₸';
      sumEl.style.color = sum > 0 ? 'var(--green)' : 'var(--light)';
    }
    total += sum;
  });
  document.getElementById('sTotalDisplay').textContent = total.toLocaleString('ru') + ' ₸';
}

function getShipmentItems() {
  const items = [];
  PRODUCTS.forEach((p, i) => {
    const checked = document.getElementById('sChk_' + i)?.checked;
    if (!checked) return;
    const qty   = parseFloat(document.getElementById('sQty_' + i)?.value) || 0;
    const price = getItemPrice(i);
    if (qty > 0) items.push({ product: p, qty, price, sum: qty * price });
  });
  return items;
}

// ══════════════════════════════════════════════════════════════
// PHONE FORMAT
// ══════════════════════════════════════════════════════════════
function formatPhone(input) {
  let digits = input.value.replace(/\D/g, '');
  if (digits.startsWith('8')) digits = '7' + digits.slice(1);
  if (!digits.startsWith('7')) digits = '7' + digits;
  digits = digits.slice(0, 11);

  let formatted = '+7';
  if (digits.length > 1) formatted += ' (' + digits.slice(1, 4);
  if (digits.length >= 4) formatted += ') ' + digits.slice(4, 7);
  if (digits.length >= 7) formatted += ' ' + digits.slice(7, 9);
  if (digits.length >= 9) formatted += ' ' + digits.slice(9, 11);

  input.value = formatted;
}

function validatePhone(phone) {
  const digits = phone.replace(/\D/g, '');
  return digits.length === 11;
}

// ══════════════════════════════════════════════════════════════
// BOOT

const savedRep = localStorage.getItem('rep');
if (savedRep) { repName = savedRep; showApp(); }
else { document.getElementById('loginScreen').style.display = 'flex'; }
